<svg width="100%" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PixelRadar - cartel editorial con pez de medios tonos">
  <defs>
    <linearGradient id="pr-bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121014"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="pr-deepD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3330"/>
      <stop offset="45%" stop-color="#081A19"/>
      <stop offset="100%" stop-color="#030404"/>
    </linearGradient>
    <linearGradient id="pr-fadeD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="pr-coralMaskD">
      <rect x="0" y="0" width="1200" height="160" fill="url(#pr-fadeD)"/>
    </mask>
    <pattern id="pr-dotsD" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="5.5" height="5.5" fill="#E6457A"/>
      <rect x="9" y="8" width="3.5" height="3.5" fill="#E6457A"/>
    </pattern>
    <linearGradient id="pr-titleGradD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6457A"/>
      <stop offset="55%" stop-color="#50F0D8"/>
      <stop offset="100%" stop-color="#4E7BE0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="url(#pr-bgD)"/>

  <!-- franja submarina (detras del pez, para que el ilustrado "flote" sobre el agua) -->
  <rect x="0" y="300" width="1200" height="160" fill="url(#pr-deepD)"/>
  <g transform="translate(0,300)" mask="url(#pr-coralMaskD)">
    <rect width="1200" height="160" fill="url(#pr-dotsD)"/>
  </g>

  <!-- etiquetas editoriales -->
  <g font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.4" fill="#D8DBE0" font-weight="700">
    <text x="48" y="46">TRAINED TO</text>
    <text x="48" y="62">SWIM IN</text>
    <text x="48" y="78">PATTERNS</text>

    <text x="226" y="46">DEEPER</text>
    <text x="226" y="62">THAN THE</text>
    <text x="226" y="78">SHOAL</text>
  </g>

  <!-- badge -->
  <rect x="952" y="36" width="200" height="34" rx="17" fill="#ECE6DE"/>
  <text x="1052" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="2" font-weight="700" fill="#0D0D0D">SONAR MIND</text>

  <!-- wordmark -->
  <text x="758" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="url(#pr-titleGradD)">Pixel</text>
  <text x="762" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#B9BFC9">radar</text>

  <!-- etiqueta vertical -->
  <text x="1175" y="236" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="3" fill="#8A9099" transform="rotate(-90 1175 236)">{ knn protocol }</text>

